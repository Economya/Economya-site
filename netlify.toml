# Redirections pour éliminer les doublons d'URL (www)
# qui empêchent Google d'indexer correctement le site.
# Chaque page ne doit exister qu'à UNE seule adresse.
#
# La redirection .html -> sans extension est gérée séparément dans le
# fichier `_redirects` (généré par generate_redirects.py), car Netlify
# n'autorise pas les jokers "*" au milieu d'un chemin comme "/*.html".

# www.economya.fr → economya.fr (redirection permanente 301)
[[redirects]]
  from = "https://www.economya.fr/*"
  to = "https://economya.fr/:splat"
  status = 301
  force = true

# Raccourci /escape -> /economya-business (le lien "naturel" que les gens
# tapent/partagent renvoyait une 404 car la vraie page est /economya-business)
[[redirects]]
  from = "/escape"
  to = "/economya-business"
  status = 301

# Economya Escape a été fusionné dans Economya Business (le funnel B2B
# s'ouvre maintenant à toutes les catégories d'astuces, plus seulement
# sorties/restos/voyage) : on redirige l'ancienne URL pour ne pas perdre
# les liens déjà partagés/indexés. La page economya-escape.html fait
# aussi sa propre redirection JS en défense en profondeur (cas des liens
# qui pointent vers le .html directement, hors passage par _redirects).
[[redirects]]
  from = "/economya-escape"
  to = "/economya-business"
  status = 301

[[redirects]]
  from = "/economya-escape.html"
  to = "/economya-business"
  status = 301

# Anciens articles de blog, supprimés du site (commit "Suppression de tous
# les articles") mais encore indexés/liés ailleurs sur le web : on évite
# de les laisser tomber sur une 404 sèche (perte de valeur SEO/trafic) en
# les redirigeant vers le forum d'astuces, le contenu le plus proche de ce
# qu'ils couvraient.
[[redirects]]
  from = "/article-*"
  to = "/forum-astuces"
  status = 301

[[redirects]]
  from = "/Aarticle*"
  to = "/forum-astuces"
  status = 301

[[redirects]]
  from = "/Arrticle*"
  to = "/forum-astuces"
  status = 301

# Profil individuel : /profil/pseudo -> fonction SSR qui injecte le
# vrai titre/la vraie description/les stats du membre avant de renvoyer
# profil.html (même logique que /astuces/post/* ci-dessous : avant,
# Google/les aperçus de partage ne voyaient qu'un gabarit générique
# identique pour tous les profils, le vrai contenu n'arrivant qu'après
# l'appel Supabase fait par le JS).
[[redirects]]
  from = "/profil/*"
  to = "/.netlify/functions/profil-ssr/:splat"
  status = 200

# Page individuelle d'une astuce : /astuces/post/42-titre -> fonction SSR
# qui injecte le vrai titre/description/contenu avant de renvoyer
# astuce.html (correctif SEO : avant, Google/les aperçus de partage ne
# voyaient que le HTML brut générique, le vrai contenu n'arrivant
# qu'après l'appel Supabase fait par le JS).
# (DOIT rester avant la règle générique /astuces/* ci-dessous : Netlify
# prend la première règle qui correspond dans l'ordre du fichier).
[[redirects]]
  from = "/astuces/post/*"
  to = "/.netlify/functions/astuce-ssr/:splat"
  status = 200

# Forums par catégorie : /astuces/telephonie -> forum-astuces.html?cat=...
[[redirects]]
  from = "/astuces/*"
  to = "/forum-astuces.html"
  status = 200

# Sitemap généré dynamiquement (ajoute les URLs des astuces individuelles,
# absentes de l'ancien sitemap.xml statique). force = true car un fichier
# sitemap.xml statique existe toujours sur le disque et serait sinon
# servi en priorité par Netlify avant cette redirection.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[build]
  publish = "."

[build.environment]
  # Le scanner de secrets de Netlify confond SUPABASE_SERVICE_ROLE_KEY
  # avec la clé anon publique deja presente dans le code (meme prefixe
  # JWT) : faux positif documente, sans fuite reelle (la cle n'est
  # jamais ecrite en clair, uniquement lue via process.env dans les
  # fonctions Netlify server-side).
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_SERVICE_ROLE_KEY"

[functions]
  directory = "netlify/functions"
