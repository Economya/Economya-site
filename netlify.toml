# Redirections pour éliminer les doublons d'URL (www)
# qui empêchent Google d'indexer correctement le site.
# Chaque page ne doit exister qu'à UNE seule adresse.
#
# La redirection .html -> sans extension est gérée séparément dans le
# fichier `_redirects` (généré par generate_redirects.py), car Netlify
# n'autorise pas les jokers "*" au milieu d'un chemin comme "/*.html".

# www.economya.fr → economya.fr (redirection permanente 301)
[[redirects]]
  from = "https://www.economya.fr/*"
  to = "https://economya.fr/:splat"
  status = 301
  force = true

# Profils publics : /profil/pseudo -> profil.html (rewrite, pas redirect,
# pour garder l'URL propre dans la barre d'adresse)
[[redirects]]
  from = "/profil/*"
  to = "/profil.html"
  status = 200

# Page individuelle d'une astuce : /astuces/post/42-titre -> astuce.html
# (DOIT rester avant la règle générique /astuces/* ci-dessous : Netlify
# prend la première règle qui correspond dans l'ordre du fichier).
[[redirects]]
  from = "/astuces/post/*"
  to = "/astuce.html"
  status = 200

# Forums par catégorie : /astuces/telephonie -> forum-astuces.html?cat=...
[[redirects]]
  from = "/astuces/*"
  to = "/forum-astuces.html"
  status = 200

[build]
  publish = "."
