<script>

let currentUser = localStorage.getItem('eco_user')||null;
let session = JSON.parse(localStorage.getItem('eco_session')||'null');

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(ts){
  const d=Date.now()-new Date(ts).getTime();
  if(d<60000)return "moins d'1 min";if(d<3600000)return Math.floor(d/60000)+'min';
  if(d<86400000)return Math.floor(d/3600000)+'h';
  return Math.floor(d/86400000)+'j';
}
async function refreshSessionIfNeeded(){
  if(!session) return;
  if(Date.now() < session.expires_at - 60000) return;
  try {
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: {'apikey': SUPABASE_KEY, 'Content-Type': 'application/json'},
      body: JSON.stringify({refresh_token: session.refresh_token})
    });
    const data = await res.json();
    if(res.ok){
      session = { access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now()+(data.expires_in||3600)*1000, user:data.user };
      localStorage.setItem('eco_session', JSON.stringify(session));
    } else {
      session = null; currentUser = null;
      localStorage.removeItem('eco_session'); localStorage.removeItem('eco_user');
    }
  } catch(e){}
}
async function sbFetch(path, options = {}) {
  await refreshSessionIfNeeded();
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    keepalive: true,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_KEY),
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=representation',
      ...options.headers
    }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

let astucesReported = [], commentsReported = [], astucesHidden = [], commentsHidden = [];

function astuceItemHtml(p, mode){
  const badge = mode === 'reported'
    ? `<span class="report-badge">🚩 ${p.reports} signalement${p.reports>1?'s':''}</span>`
    : `<span class="hidden-badge">🙈 masqué</span>`;
  const actions = mode === 'reported'
    ? `<button onclick="hideAstuce(${p.id})" class="danger">Masquer</button>
       <button onclick="dismissAstuceReport(${p.id})">Ignorer le signalement</button>
       <a href="/astuces/post/${p.id}" target="_blank">Voir →</a>`
    : `<button onclick="restoreAstuce(${p.id})" class="primary">Restaurer</button>
       <button onclick="resendNotice('astuce', ${p.id})">Prévenir l'auteur</button>
       <a href="/astuces/post/${p.id}" target="_blank">Voir →</a>`;
  return `<div class="item" id="astuce-${p.id}">
    <div class="item-head">
      <div class="item-meta">Astuce · ${escapeHtml(p.auteur||'Anonyme')} · ${escapeHtml(p.categorie||'')}${p.enseigne?' · 🏷️ '+escapeHtml(p.enseigne):''}${p.lieu?' · 📍 '+escapeHtml(p.lieu):''} · il y a ${timeAgo(p.created_at)}</div>
      ${badge}
    </div>
    <div class="item-title">${escapeHtml(p.titre)}</div>
    <div class="item-body">${escapeHtml(p.description)}</div>
    ${p.proof_image_url?`<a href="${escapeHtml(p.proof_image_url)}" target="_blank" rel="noopener"><img class="item-proof-img" src="${escapeHtml(p.proof_image_url)}" alt="Preuve jointe" loading="lazy" decoding="async"></a>`:''}
    <div class="item-actions">${actions}</div>
  </div>`;
}

function commentItemHtml(c, mode){
  const badge = mode === 'reported'
    ? `<span class="report-badge">🚩 ${c.reports} signalement${c.reports>1?'s':''}</span>`
    : `<span class="hidden-badge">🙈 masqué</span>`;
  const actions = mode === 'reported'
    ? `<button onclick="hideComment(${c.id})" class="danger">Masquer</button>
       <button onclick="dismissCommentReport(${c.id})">Ignorer le signalement</button>
       <a href="/astuces/post/${c.astuce_id}" target="_blank">Voir l'astuce →</a>`
    : `<button onclick="restoreComment(${c.id})" class="primary">Restaurer</button>
       <button onclick="resendNotice('comment', ${c.id})">Prévenir l'auteur</button>
       <a href="/astuces/post/${c.astuce_id}" target="_blank">Voir l'astuce →</a>`;
  return `<div class="item" id="comment-${c.id}">
    <div class="item-head">
      <div class="item-meta">Commentaire · ${escapeHtml(c.auteur||'Anonyme')} · il y a ${timeAgo(c.created_at)}</div>
      ${badge}
    </div>
    <div class="item-body">${escapeHtml(c.contenu)}</div>
    <div class="item-actions">${actions}</div>
  </div>`;
}

function renderReported(){
  const list = document.getElementById('reportedList');
  const items = [...astucesReported.map(p=>({p,type:'astuce'})), ...commentsReported.map(c=>({c,type:'comment'}))];
  document.getElementById('reportedCount').textContent = items.length ? '(' + items.length + ')' : '';
  if(!items.length){ list.innerHTML = '<p class="empty">Aucun signalement en attente. 🎉</p>'; return; }
  list.innerHTML = items.map(x => x.type === 'astuce' ? astuceItemHtml(x.p,'reported') : commentItemHtml(x.c,'reported')).join('');
}
function renderHidden(){
  const list = document.getElementById('hiddenList');
  const items = [...astucesHidden.map(p=>({p,type:'astuce'})), ...commentsHidden.map(c=>({c,type:'comment'}))];
  document.getElementById('hiddenCount').textContent = items.length ? '(' + items.length + ')' : '';
  if(!items.length){ list.innerHTML = '<p class="empty">Rien de masqué actuellement.</p>'; return; }
  list.innerHTML = items.map(x => x.type === 'astuce' ? astuceItemHtml(x.p,'hidden') : commentItemHtml(x.c,'hidden')).join('');
}

async function loadAll(){
  try {
    [astucesReported, commentsReported, astucesHidden, commentsHidden] = await Promise.all([
      sbFetch('astuces?reports=gt.0&hidden=eq.false&order=reports.desc&select=*'),
      sbFetch('astuce_comments?reports=gt.0&hidden=eq.false&order=reports.desc&select=*'),
      sbFetch('astuces?hidden=eq.true&select=*'),
      sbFetch('astuce_comments?hidden=eq.true&select=*')
    ]);
  } catch(e){
    document.getElementById('panel').innerHTML = '<p class="state">Erreur de chargement : ' + escapeHtml(e.message) + '</p>';
    return;
  }
  renderReported();
  renderHidden();
  loadLog();
}

// ---- Historique des decisions de moderation (trace datee, visible des admins uniquement) ----
const DECISIONS = {masque:'Masqué', restaure:'Restauré', signalement_ignore:'Signalement ignoré', notice_renvoyee:'E-mail renvoyé'};
function motifLabel(key){ const m = MOTIFS.find(function(x){ return x[0] === key; }); return m ? m[1] : (key || ''); }
async function logDecision(type, item, decision, motif){
  try {
    await sbFetch('moderation_log', {method:'POST', prefer:'return=minimal', headers:{'Prefer':'return=minimal'}, body: JSON.stringify({
      content_type: type,
      content_id: String(item ? item.id : ''),
      content_title: item ? String(type === 'astuce' ? (item.titre||'') : (item.contenu||'')).slice(0,200) : null,
      author_id: (item && item.user_id) || null,
      decision: decision,
      motif_categorie: motif ? motif.categorie : null,
      motif_detail: motif && motif.detail ? motif.detail : null
    })});
    loadLog();
  } catch(e){
    alert("La décision a bien été appliquée, mais elle n'a pas pu être enregistrée dans l'historique : " + e.message);
  }
}
async function loadLog(){
  const list = document.getElementById('logList');
  try {
    const rows = await sbFetch('moderation_log?order=created_at.desc&limit=50&select=*');
    document.getElementById('logCount').textContent = rows.length ? '(' + rows.length + ' dernières)' : '';
    if(!rows.length){ list.innerHTML = '<p class="empty">Aucune décision enregistrée pour le moment.</p>'; return; }
    list.innerHTML = rows.map(function(r){
      const d = new Date(r.created_at).toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
      const motif = r.motif_categorie ? ' · ' + escapeHtml(motifLabel(r.motif_categorie)) + (r.motif_detail ? ' (' + escapeHtml(r.motif_detail) + ')' : '') : '';
      return '<div class="item"><div class="item-head"><div class="item-meta">' + d + ' · ' + (r.content_type === 'astuce' ? 'Astuce' : 'Commentaire') + ' n°' + escapeHtml(r.content_id) + '</div><span class="hidden-badge">' + escapeHtml(DECISIONS[r.decision] || r.decision) + '</span></div>'
        + '<div class="item-body">' + escapeHtml(r.content_title || '') + motif + '</div></div>';
    }).join('');
  } catch(e){
    list.innerHTML = '<p class="empty">Historique indisponible : ' + escapeHtml(e.message) + '</p>';
  }
}

const MOTIFS = [
  ['illegal',     'Contenu illégal ou incitant à la haine'],
  ['diffamation', 'Propos diffamatoires, injurieux ou discriminatoires'],
  ['droits',      "Atteinte aux droits d'un tiers (droit d'auteur, droit à l'image, vie privée)"],
  ['trompeur',    'Astuce ou offre trompeuse ou fausse'],
  ['spam',        'Spam, publicité ou démarchage non autorisés'],
  ['usurpation',  "Usurpation d'identité"],
  ['partenariat', 'Offre commerciale non signalée comme partenariat'],
  ['autre',       'Autre motif (à préciser)']
];
function askMotif(){
  return new Promise(function(resolve){
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:14px;max-width:460px;width:100%;padding:20px;font-family:inherit;box-shadow:0 20px 50px rgba(0,0,0,.25)';
    box.innerHTML = '<h3 style="margin:0 0 6px;font-size:1.05rem">Pourquoi masquer ce contenu ?</h3>'
      + '<p style="margin:0 0 12px;font-size:.85rem;color:#6b7280">Le motif sera envoyé par e-mail à l\'auteur, avec la possibilité de contester.</p>'
      + '<label style="font-size:.8rem;font-weight:700">Catégorie</label>'
      + '<select id="mdMotif" style="width:100%;margin:4px 0 12px;padding:9px;border:1px solid #d1d5db;border-radius:8px;font-size:.9rem"></select>'
      + '<label style="font-size:.8rem;font-weight:700">Précisions <span id="mdReq" style="font-weight:400;color:#6b7280">(facultatif)</span></label>'
      + '<textarea id="mdDetail" maxlength="500" rows="3" style="width:100%;margin:4px 0 4px;padding:9px;border:1px solid #d1d5db;border-radius:8px;font-size:.9rem;font-family:inherit;resize:vertical"></textarea>'
      + '<div id="mdErr" style="color:#dc2626;font-size:.8rem;min-height:1.1em;margin-bottom:8px"></div>'
      + '<div style="display:flex;gap:8px;justify-content:flex-end">'
      + '<button type="button" id="mdCancel" style="padding:9px 14px;border:1px solid #d1d5db;background:#fff;border-radius:8px;cursor:pointer">Annuler</button>'
      + '<button type="button" id="mdOk" style="padding:9px 14px;border:0;background:#dc2626;color:#fff;border-radius:8px;cursor:pointer;font-weight:700">Masquer et prévenir l\'auteur</button>'
      + '</div>';
    ov.appendChild(box); document.body.appendChild(ov);
    const sel = box.querySelector('#mdMotif');
    MOTIFS.forEach(function(m){ const o = document.createElement('option'); o.value = m[0]; o.textContent = m[1]; sel.appendChild(o); });
    const req = box.querySelector('#mdReq');
    sel.addEventListener('change', function(){ req.textContent = sel.value === 'autre' ? '(obligatoire)' : '(facultatif)'; });
    function done(v){ document.body.removeChild(ov); resolve(v); }
    box.querySelector('#mdCancel').addEventListener('click', function(){ done(null); });
    ov.addEventListener('click', function(e){ if(e.target === ov) done(null); });
    box.querySelector('#mdOk').addEventListener('click', function(){
      const detail = box.querySelector('#mdDetail').value.trim();
      if(sel.value === 'autre' && detail.length < 3){ box.querySelector('#mdErr').textContent = 'Merci de préciser le motif.'; return; }
      done({categorie: sel.value, detail: detail});
    });
  });
}
async function notifyHidden(type, id, motif){
  try {
    await refreshSessionIfNeeded();
    const res = await fetch('/.netlify/functions/notify-content-hidden', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (session ? session.access_token : '')},
      body: JSON.stringify({type: type, id: id, categorie: motif.categorie, detail: motif.detail})
    });
    const data = await res.json().catch(function(){ return {}; });
    if(res.ok && data.sent === false && data.reason === 'no_user') return false; // contenu sans compte (ex. offre Business)
    if(!res.ok || data.sent !== true){
      alert("L'e-mail a l'auteur n'a pas pu etre envoye (cause : " + (data.reason || data.error || ('HTTP ' + res.status)) + (data.detail ? ' - ' + data.detail : '') + "). Ecrivez-lui a la main, avec le motif.");
      return false;
    }
    return true;
  } catch(e){
    alert("L'e-mail a l'auteur n'a pas pu etre envoye. Ecrivez-lui a la main, avec le motif.");
    return false;
  }
}

// Renvoyer l'e-mail a l'auteur d'un contenu deja masque (ex. si le premier envoi a echoue)
async function resendNotice(type, id){
  const motif = await askMotif();
  if(!motif) return;
  const ok = await notifyHidden(type, id, motif);
  if(ok){
    alert("E-mail envoye a l'auteur.");
    const src = type === 'astuce' ? astucesHidden : commentsHidden;
    logDecision(type, src.find(function(x){ return x.id === id; }), 'notice_renvoyee', motif);
  }
}
window.resendNotice = resendNotice;

async function hideAstuce(id){
  const motif = await askMotif();
  if(!motif) return;
  try {
    await sbFetch('astuces?id=eq.'+id, {method:'PATCH', body:JSON.stringify({hidden:true}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
    const item = astucesReported.find(p=>p.id===id);
    astucesReported = astucesReported.filter(p=>p.id!==id);
    await logDecision('astuce', item, 'masque', motif);
    await notifyHidden('astuce', id, motif);
    loadAll();
  } catch(e){ alert('Erreur : l\'action n\'a pas pu etre effectuee. ' + e.message); }
}
async function dismissAstuceReport(id){
  try {
    await sbFetch('astuces?id=eq.'+id, {method:'PATCH', body:JSON.stringify({reports:0}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
    logDecision('astuce', astucesReported.find(p=>p.id===id), 'signalement_ignore', null);
    astucesReported = astucesReported.filter(p=>p.id!==id);
    renderReported();
  } catch(e){ alert('Erreur : l\'action n\'a pas pu etre effectuee. ' + e.message); }
}
async function restoreAstuce(id){
  try {
    await sbFetch('astuces?id=eq.'+id, {method:'PATCH', body:JSON.stringify({hidden:false, reports:0}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
    logDecision('astuce', astucesHidden.find(p=>p.id===id), 'restaure', null);
    astucesHidden = astucesHidden.filter(p=>p.id!==id);
    renderHidden();
  } catch(e){ alert('Erreur : l\'action n\'a pas pu etre effectuee. ' + e.message); }
}
async function hideComment(id){
  const motif = await askMotif();
  if(!motif) return;
  try {
    await sbFetch('astuce_comments?id=eq.'+id, {method:'PATCH', body:JSON.stringify({hidden:true}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
    const item = commentsReported.find(c=>c.id===id);
    commentsReported = commentsReported.filter(c=>c.id!==id);
    await logDecision('comment', item, 'masque', motif);
    await notifyHidden('comment', id, motif);
    loadAll();
  } catch(e){ alert('Erreur : l\'action n\'a pas pu etre effectuee. ' + e.message); }
}
async function dismissCommentReport(id){
  try {
    await sbFetch('astuce_comments?id=eq.'+id, {method:'PATCH', body:JSON.stringify({reports:0}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
    logDecision('comment', commentsReported.find(c=>c.id===id), 'signalement_ignore', null);
    commentsReported = commentsReported.filter(c=>c.id!==id);
    renderReported();
  } catch(e){ alert('Erreur : l\'action n\'a pas pu etre effectuee. ' + e.message); }
}
async function restoreComment(id){
  try {
    await sbFetch('astuce_comments?id=eq.'+id, {method:'PATCH', body:JSON.stringify({hidden:false, reports:0}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
    logDecision('comment', commentsHidden.find(c=>c.id===id), 'restaure', null);
    commentsHidden = commentsHidden.filter(c=>c.id!==id);
    renderHidden();
  } catch(e){ alert('Erreur : l\'action n\'a pas pu etre effectuee. ' + e.message); }
}
window.hideAstuce = hideAstuce;
window.dismissAstuceReport = dismissAstuceReport;
window.restoreAstuce = restoreAstuce;
window.hideComment = hideComment;
window.dismissCommentReport = dismissCommentReport;
window.restoreComment = restoreComment;

async function init(){
  const gate = document.getElementById('gate');
  if(!session || !session.user){
    gate.innerHTML = 'Cette page est réservée aux modérateurs. <a href="/connexion.html?redirect=' + encodeURIComponent(location.pathname) + '">Connectez-vous</a>.';
    return;
  }
  try {
    const rows = await sbFetch('profiles?id=eq.' + session.user.id + '&select=is_admin');
    if(!rows || !rows[0] || !rows[0].is_admin){
      gate.textContent = 'Accès réservé aux modérateurs. Ce compte n\'a pas les droits nécessaires.';
      return;
    }
  } catch(e){
    gate.textContent = 'Impossible de vérifier vos droits pour le moment.';
    return;
  }
  gate.style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  loadAll();
}
init();
</script>
</main>
