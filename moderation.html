<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Modération — Economya.fr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html{overflow-y:scroll}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1D9E75;--gl:#E1F5EE;--gd:#085041;--a:#EF9F27;--r:16px;--t:#2C2C2A;--m:#5F5E5A;--bg:#FAFAF8;--w:#fff;--b:rgba(0,0,0,0.08)}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
nav{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.8rem;background:var(--w);border-bottom:1px solid var(--b)}
.logo{font-family:'Playfair Display',serif;font-weight:900;font-size:1.3rem;color:var(--gd);text-decoration:none}
.logo span{color:var(--a)}
.nav-back{text-decoration:none;color:var(--m);font-size:.82rem;font-weight:500}
.container{max-width:760px;margin:0 auto;padding:2.2rem 1.5rem 4rem}
h1{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:900;margin-bottom:1.6rem}
h2{font-size:1.05rem;font-weight:700;margin:2rem 0 1rem;display:flex;align-items:center;gap:8px}
.state{text-align:center;padding:2.5rem 1rem;color:var(--m)}
.item{background:var(--w);border:1px solid var(--b);border-radius:var(--r);padding:1.2rem 1.4rem;margin-bottom:12px}
.item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.item-meta{font-size:.78rem;color:var(--m)}
.item-title{font-weight:700;font-size:.95rem;margin-bottom:4px}
.item-body{font-size:.88rem;line-height:1.55;color:var(--t);white-space:pre-wrap;margin-bottom:10px}
.report-badge{display:inline-flex;align-items:center;gap:5px;background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;border-radius:99px;padding:3px 11px;font-size:.75rem;font-weight:700;white-space:nowrap}
.hidden-badge{display:inline-flex;align-items:center;gap:5px;background:#F3F4F6;color:#6B7280;border:1px solid #E5E7EB;border-radius:99px;padding:3px 11px;font-size:.75rem;font-weight:700;white-space:nowrap}
.item-actions{display:flex;gap:8px;flex-wrap:wrap}
.item-actions button{border:1px solid var(--b);background:var(--bg);border-radius:99px;padding:6px 14px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--t)}
.item-actions button:hover{background:#F0F0EE}
.item-actions button.danger{color:#DC2626;border-color:#FECACA}
.item-actions button.primary{background:linear-gradient(135deg,var(--g),#25B788);color:#fff;border:none}
.item-actions a{color:var(--gd);font-size:.8rem;font-weight:600;text-decoration:none;align-self:center}
.empty{color:var(--m);font-size:.88rem;padding:.5rem 0}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/index.html">Econom<span>ya</span>.fr</a>
  <a class="nav-back" href="/forum-astuces.html">← Retour au forum</a>
</nav>

<div class="container">
  <h1>🛡️ Modération</h1>
  <div id="gate" class="state">Vérification des droits…</div>
  <div id="panel" style="display:none">
    <h2>🚩 Signalements en attente <span id="reportedCount"></span></h2>
    <div id="reportedList"></div>
    <h2>🙈 Contenu masqué <span id="hiddenCount"></span></h2>
    <div id="hiddenList"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://awelbxqiltokhsoddako.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3ZWxieHFpbHRva2hzb2RkYWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM1MjIsImV4cCI6MjEwNDkyOTUyMn0.pao4Gxw9S7bdfTFExd3W1idWEV76VvykeiZSSf3mQxw';
let currentUser = localStorage.getItem('eco_user')||null;
let session = JSON.parse(localStorage.getItem('eco_session')||'null');

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(ts){
  const d=Date.now()-new Date(ts).getTime();
  if(d<3600000)return Math.floor(d/60000)+'min';
  if(d<86400000)return Math.floor(d/3600000)+'h';
  return Math.floor(d/86400000)+'j';
}
async function refreshSessionIfNeeded(){
  if(!session) return;
  if(Date.now() < session.expires_at - 60000) return;
  try {
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: {'apikey': SUPABASE_KEY, 'Content-Type': 'application/json'},
      body: JSON.stringify({refresh_token: session.refresh_token})
    });
    const data = await res.json();
    if(res.ok){
      session = { access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now()+(data.expires_in||3600)*1000, user:data.user };
      localStorage.setItem('eco_session', JSON.stringify(session));
    } else {
      session = null; currentUser = null;
      localStorage.removeItem('eco_session'); localStorage.removeItem('eco_user');
    }
  } catch(e){}
}
async function sbFetch(path, options = {}) {
  await refreshSessionIfNeeded();
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_KEY),
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=representation',
      ...options.headers
    }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

let astucesReported = [], commentsReported = [], astucesHidden = [], commentsHidden = [];

function astuceItemHtml(p, mode){
  const badge = mode === 'reported'
    ? `<span class="report-badge">🚩 ${p.reports} signalement${p.reports>1?'s':''}</span>`
    : `<span class="hidden-badge">🙈 masqué</span>`;
  const actions = mode === 'reported'
    ? `<button onclick="hideAstuce(${p.id})" class="danger">Masquer</button>
       <button onclick="dismissAstuceReport(${p.id})">Ignorer le signalement</button>
       <a href="/astuces/post/${p.id}" target="_blank">Voir →</a>`
    : `<button onclick="restoreAstuce(${p.id})" class="primary">Restaurer</button>
       <a href="/astuces/post/${p.id}" target="_blank">Voir →</a>`;
  return `<div class="item" id="astuce-${p.id}">
    <div class="item-head">
      <div class="item-meta">Astuce · ${escapeHtml(p.auteur||'Anonyme')} · ${escapeHtml(p.categorie||'')} · il y a ${timeAgo(p.created_at)}</div>
      ${badge}
    </div>
    <div class="item-title">${escapeHtml(p.titre)}</div>
    <div class="item-body">${escapeHtml(p.description)}</div>
    <div class="item-actions">${actions}</div>
  </div>`;
}

function commentItemHtml(c, mode){
  const badge = mode === 'reported'
    ? `<span class="report-badge">🚩 ${c.reports} signalement${c.reports>1?'s':''}</span>`
    : `<span class="hidden-badge">🙈 masqué</span>`;
  const actions = mode === 'reported'
    ? `<button onclick="hideComment(${c.id})" class="danger">Masquer</button>
       <button onclick="dismissCommentReport(${c.id})">Ignorer le signalement</button>
       <a href="/astuces/post/${c.astuce_id}" target="_blank">Voir l'astuce →</a>`
    : `<button onclick="restoreComment(${c.id})" class="primary">Restaurer</button>
       <a href="/astuces/post/${c.astuce_id}" target="_blank">Voir l'astuce →</a>`;
  return `<div class="item" id="comment-${c.id}">
    <div class="item-head">
      <div class="item-meta">Commentaire · ${escapeHtml(c.auteur||'Anonyme')} · il y a ${timeAgo(c.created_at)}</div>
      ${badge}
    </div>
    <div class="item-body">${escapeHtml(c.contenu)}</div>
    <div class="item-actions">${actions}</div>
  </div>`;
}

function renderReported(){
  const list = document.getElementById('reportedList');
  const items = [...astucesReported.map(p=>({p,type:'astuce'})), ...commentsReported.map(c=>({c,type:'comment'}))];
  document.getElementById('reportedCount').textContent = items.length ? '(' + items.length + ')' : '';
  if(!items.length){ list.innerHTML = '<p class="empty">Aucun signalement en attente. 🎉</p>'; return; }
  list.innerHTML = items.map(x => x.type === 'astuce' ? astuceItemHtml(x.p,'reported') : commentItemHtml(x.c,'reported')).join('');
}
function renderHidden(){
  const list = document.getElementById('hiddenList');
  const items = [...astucesHidden.map(p=>({p,type:'astuce'})), ...commentsHidden.map(c=>({c,type:'comment'}))];
  document.getElementById('hiddenCount').textContent = items.length ? '(' + items.length + ')' : '';
  if(!items.length){ list.innerHTML = '<p class="empty">Rien de masqué actuellement.</p>'; return; }
  list.innerHTML = items.map(x => x.type === 'astuce' ? astuceItemHtml(x.p,'hidden') : commentItemHtml(x.c,'hidden')).join('');
}

async function loadAll(){
  try {
    [astucesReported, commentsReported, astucesHidden, commentsHidden] = await Promise.all([
      sbFetch('astuces?reports=gt.0&hidden=eq.false&order=reports.desc&select=*'),
      sbFetch('astuce_comments?reports=gt.0&hidden=eq.false&order=reports.desc&select=*'),
      sbFetch('astuces?hidden=eq.true&select=*'),
      sbFetch('astuce_comments?hidden=eq.true&select=*')
    ]);
  } catch(e){
    document.getElementById('panel').innerHTML = '<p class="state">Erreur de chargement : ' + escapeHtml(e.message) + '</p>';
    return;
  }
  renderReported();
  renderHidden();
}

async function hideAstuce(id){
  if(!confirm('Masquer cette astuce du site ?')) return;
  await sbFetch('astuces?id=eq.'+id, {method:'PATCH', body:JSON.stringify({hidden:true}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
  astucesReported = astucesReported.filter(p=>p.id!==id);
  loadAll();
}
async function dismissAstuceReport(id){
  await sbFetch('astuces?id=eq.'+id, {method:'PATCH', body:JSON.stringify({reports:0}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
  astucesReported = astucesReported.filter(p=>p.id!==id);
  renderReported();
}
async function restoreAstuce(id){
  await sbFetch('astuces?id=eq.'+id, {method:'PATCH', body:JSON.stringify({hidden:false, reports:0}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
  astucesHidden = astucesHidden.filter(p=>p.id!==id);
  renderHidden();
}
async function hideComment(id){
  if(!confirm('Masquer ce commentaire ?')) return;
  await sbFetch('astuce_comments?id=eq.'+id, {method:'PATCH', body:JSON.stringify({hidden:true}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
  commentsReported = commentsReported.filter(c=>c.id!==id);
  loadAll();
}
async function dismissCommentReport(id){
  await sbFetch('astuce_comments?id=eq.'+id, {method:'PATCH', body:JSON.stringify({reports:0}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
  commentsReported = commentsReported.filter(c=>c.id!==id);
  renderReported();
}
async function restoreComment(id){
  await sbFetch('astuce_comments?id=eq.'+id, {method:'PATCH', body:JSON.stringify({hidden:false, reports:0}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
  commentsHidden = commentsHidden.filter(c=>c.id!==id);
  renderHidden();
}
window.hideAstuce = hideAstuce;
window.dismissAstuceReport = dismissAstuceReport;
window.restoreAstuce = restoreAstuce;
window.hideComment = hideComment;
window.dismissCommentReport = dismissCommentReport;
window.restoreComment = restoreComment;

async function init(){
  const gate = document.getElementById('gate');
  if(!session || !session.user){
    gate.innerHTML = 'Cette page est réservée aux modérateurs. <a href="/connexion.html?redirect=' + encodeURIComponent(location.pathname) + '">Connectez-vous</a>.';
    return;
  }
  try {
    const rows = await sbFetch('profiles?id=eq.' + session.user.id + '&select=is_admin');
    if(!rows || !rows[0] || !rows[0].is_admin){
      gate.textContent = 'Accès réservé aux modérateurs. Ce compte n\'a pas les droits nécessaires.';
      return;
    }
  } catch(e){
    gate.textContent = 'Impossible de vérifier vos droits pour le moment.';
    return;
  }
  gate.style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  loadAll();
}
init();
</script>
</body>
</html>
