<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astuces — Economya Community</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{
  --bg:#FAFAFA;--white:#fff;--border:#EFEFEF;
  --ink:#0A0A0A;--muted:#737373;--gold:#F59E0B;
  --green:#22C55E;--red:#EF4444;--blue:#3B82F6;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
a{text-decoration:none;color:inherit;}
button{font-family:'Inter',sans-serif;cursor:pointer;}

.nav{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99;}
.nav-logo{font-weight:900;font-size:20px;letter-spacing:-.03em;}
.nav-logo em{color:var(--gold);font-style:normal;}
.nav-icons{display:flex;align-items:center;gap:4px;}
.nav-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;cursor:pointer;border:2px solid var(--border);}
.nav-login{display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:none;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;}

.tabs{background:var(--white);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:52px;z-index:98;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:14px 16px;font-size:14px;font-weight:600;color:var(--muted);border:none;background:transparent;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s;}
.tab.active{color:var(--ink);border-bottom-color:var(--ink);}

.wrap{max-width:600px;margin:0 auto;}

.stories{display:flex;gap:12px;padding:14px 16px;overflow-x:auto;scrollbar-width:none;background:var(--white);border-bottom:1px solid var(--border);}
.stories::-webkit-scrollbar{display:none;}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;cursor:pointer;}
.story-ring{width:58px;height:58px;border-radius:50%;padding:2px;position:relative;}
.story-bell{position:absolute;top:-3px;right:-3px;width:20px;height:20px;border-radius:50%;background:#fff;border:1.5px solid var(--border);font-size:10px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:2;}
.story-bell.on{border-color:var(--gold);background:#FFFBEB;}
.story-dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--white);z-index:1;}
.story-ring.active{background:linear-gradient(45deg,var(--gold),#f59e0b);}
.story-ring.inactive{background:var(--border);}
.story-inner{width:100%;height:100%;border-radius:50%;background:var(--white);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--white);}
.story-label{font-size:10px;font-weight:600;color:var(--muted);text-align:center;max-width:58px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.story.sel .story-label{color:var(--ink);font-weight:700;}

.cta-bar{background:linear-gradient(135deg,#FEF3C7,#FFF);border-bottom:1px solid #FDE68A;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.cta-bar-text{font-size:13px;font-weight:600;color:#92400E;flex:1;}
.cta-bar-btn{background:#F59E0B;color:#1A0A00;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;flex-shrink:0;}

.post{background:var(--white);border-bottom:1px solid var(--border);padding:14px 16px;}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.post-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
.post-meta{flex:1;min-width:0;}
.post-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
.post-rank{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:700;}
.post-time{font-size:12px;color:var(--muted);}
.post-cat{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
.post-title{font-weight:800;font-size:16px;line-height:1.35;letter-spacing:-.01em;margin-bottom:8px;}
.post-body{font-size:14px;color:#404040;line-height:1.55;margin-bottom:12px;}
.saving-pill{display:inline-flex;align-items:center;gap:5px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--green);margin-bottom:12px;}
.reliability{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.rel-track{flex:1;height:4px;background:var(--border);border-radius:99px;overflow:hidden;max-width:100px;}
.rel-fill{height:100%;border-radius:99px;}
.rel-label{font-size:12px;font-weight:700;}
.post-actions{display:flex;align-items:center;gap:0;}
.action{display:flex;align-items:center;gap:5px;padding:8px 10px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border-radius:8px;transition:all .15s;flex:1;justify-content:center;}
.action:hover{background:var(--bg);}
.action.liked{color:var(--green);}
.action.tested-on{color:var(--blue);}
.action.flagged{color:var(--red);}
.action-icon{font-size:18px;}

.fab{position:fixed;bottom:24px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;border:none;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:50;cursor:pointer;}
.fab:active{transform:scale(.93);}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.sheet{background:var(--white);border-radius:20px 20px 0 0;padding:20px 20px 32px;width:100%;max-width:600px;animation:slideUp .25s ease;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 18px;}
.sheet h3{font-weight:900;font-size:18px;margin-bottom:16px;letter-spacing:-.02em;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;font-size:15px;font-family:'Inter',sans-serif;outline:none;background:var(--bg);}
.field textarea{min-height:80px;resize:none;}
.char-count{float:right;font-weight:500;color:var(--muted);}
.sheet-actions{display:flex;gap:10px;margin-top:16px;}
.btn-pub{flex:1;background:var(--ink);color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;}
.btn-ann{background:var(--bg);border:1.5px solid var(--border);color:var(--muted);border-radius:12px;padding:14px 20px;font-size:15px;font-weight:600;}

.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:44px;margin-bottom:10px;}
.empty h3{font-weight:800;font-size:16px;color:var(--ink);margin-bottom:6px;}

.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px;}
</style>
</head>
<body>

<div class="wrap">
<nav class="nav">
  <div class="nav-logo">Eco<em>nomya</em></div>
  <div class="nav-icons">
    <div id="navAv" onclick="onAvatarClick()"></div>
  </div>
</nav>

<div class="tabs">
  <button class="tab active" onclick="setSort('top',this)">🔥 Top</button>
  <button class="tab" onclick="setSort('new',this)">🆕 Nouveau</button>
  <button class="tab" onclick="setSort('eco',this)">💰 Économies</button>
  <button class="tab" onclick="setSort('rel',this)">✅ Fiables</button>
</div>

<div class="cta-bar">
  <div class="cta-bar-text">💡 Votre astuce peut aider des milliers de personnes</div>
  <button class="cta-bar-btn" onclick="openPost()">✏️ Partager</button>
</div>

<div class="stories" id="stories"></div>
<div id="feed"><div class="loading">Chargement des astuces...</div></div>
</div>

<button class="fab" onclick="openPost()">✏️</button>

<div class="modal-bg" id="shPost">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>💡 Partager une astuce</h3>
    <div class="field"><label>Titre</label><input id="fTitle" placeholder="Mon astuce pour économiser..." maxlength="100"></div>
    <div class="field">
      <label>Description <span class="char-count" id="charCount">0/500</span></label>
      <textarea id="fBody" placeholder="Comment ça marche ? Combien tu économises ?" maxlength="500" oninput="updateCount()"></textarea>
    </div>
    <div class="field"><label>Catégorie</label>
      <select id="fCat">
        <option value="📱 Téléphonie">📱 Téléphonie</option>
        <option value="🛒 Courses & Alimentation">🛒 Courses & Alimentation</option>
        <option value="⚡ Énergie & Eau">⚡ Énergie & Eau</option>
        <option value="🏦 Banque & Épargne">🏦 Banque & Épargne</option>
        <option value="🚗 Transport & Carburant">🚗 Transport & Carburant</option>
        <option value="✈️ Voyage & Vacances">✈️ Voyage & Vacances</option>
        <option value="🏠 Logement & Loyer">🏠 Logement & Loyer</option>
        <option value="🎬 Abonnements & Streaming">🎬 Abonnements & Streaming</option>
        <option value="🛡️ Assurances">🛡️ Assurances</option>
        <option value="👕 Mode & Vêtements">👕 Mode & Vêtements</option>
        <option value="🍽️ Restaurants & Sorties">🍽️ Restaurants & Sorties</option>
        <option value="💊 Santé & Pharmacie">💊 Santé & Pharmacie</option>
        <option value="📚 Enfants & Éducation">📚 Enfants & Éducation</option>
        <option value="🐾 Animaux">🐾 Animaux</option>
        <option value="🎁 Cadeaux & Fêtes">🎁 Cadeaux & Fêtes</option>
        <option value="💡 Bricolage & Maison">💡 Bricolage & Maison</option>
        <option value="🖥️ High-Tech & Informatique">🖥️ High-Tech & Informatique</option>
        <option value="💡 Autre">💡 Autre</option>
      </select>
    </div>
    <div class="field"><label>Économie estimée</label><input id="fSaving" type="number" placeholder="Ex: 300€, 50€/mois..." min="0" max="99999"></div>
    <div class="field"><label>Votre prénom</label><input id="fAuthor" placeholder="Marie" maxlength="30"></div>
    <div class="sheet-actions">
      <button class="btn-ann" onclick="closeAll()">Annuler</button>
      <button class="btn-pub" onclick="submitPost()">🚀 Publier</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="shAuth">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="authTitle">🔐 Connexion</h3>
    <div id="authError" style="display:none;font-size:13px;font-weight:600;margin-bottom:12px;padding:10px 12px;border-radius:10px;"></div>
    <div class="field" id="authPseudoField" style="display:none">
      <label>Pseudo</label><input id="authPseudo" placeholder="Marie" maxlength="30">
    </div>
    <div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="vous@email.com"></div>
    <div class="field"><label>Mot de passe</label><input id="authPassword" type="password" placeholder="6 caractères minimum" minlength="6"></div>
    <div class="sheet-actions">
      <button class="btn-ann" onclick="closeAll()">Annuler</button>
      <button class="btn-pub" onclick="submitAuth()" id="authSubmitBtn">Se connecter</button>
    </div>
    <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:16px;cursor:pointer" id="authToggleText" onclick="toggleAuthMode()">Pas encore de compte ? <b>Inscrivez-vous</b></p>
  </div>
</div>

<div class="modal-bg" id="shMe">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>👋 <span id="meNom"></span></h3>
    <div class="sheet-actions" style="margin-top:16px;">
      <a class="btn-ann" style="flex:1;display:flex;align-items:center;justify-content:center;text-decoration:none" id="meProfilLink" href="#">Mon profil</a>
      <button class="btn-pub" style="background:#EF4444" onclick="logout()">Déconnexion</button>
    </div>
  </div>
</div>

<script>
// ── Supabase config ───────────────────────────────────
const SUPABASE_URL = 'https://awelbxqiltokhsoddako.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3ZWxieHFpbHRva2hzb2RkYWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM1MjIsImV4cCI6MjEwNDkyOTUyMn0.pao4Gxw9S7bdfTFExd3W1idWEV76VvykeiZSSf3mQxw';

async function sbFetch(path, options = {}) {
  await refreshSessionIfNeeded();
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_KEY),
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=representation',
      ...options.headers
    }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

// ── Auth Supabase (email + mot de passe) ───────────────
let authMode = 'login';
function openAuth(){
  authMode = 'login';
  document.getElementById('authTitle').textContent = '🔐 Connexion';
  document.getElementById('authPseudoField').style.display = 'none';
  document.getElementById('authSubmitBtn').textContent = 'Se connecter';
  document.getElementById('authToggleText').innerHTML = 'Pas encore de compte ? <b>Inscrivez-vous</b>';
  document.getElementById('authError').style.display = 'none';
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authPseudo').value = '';
  document.getElementById('shAuth').classList.add('open');
}
function toggleAuthMode(){
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('authTitle').textContent = authMode === 'login' ? '🔐 Connexion' : '✨ Inscription';
  document.getElementById('authPseudoField').style.display = authMode === 'signup' ? 'block' : 'none';
  document.getElementById('authSubmitBtn').textContent = authMode === 'login' ? 'Se connecter' : "S'inscrire";
  document.getElementById('authToggleText').innerHTML = authMode === 'login'
    ? 'Pas encore de compte ? <b>Inscrivez-vous</b>'
    : 'Déjà un compte ? <b>Connectez-vous</b>';
  document.getElementById('authError').style.display = 'none';
}
function showAuthError(msg, ok){
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.background = ok ? '#F0FDF4' : '#FEF2F2';
  el.style.color = ok ? '#16A34A' : '#DC2626';
  el.style.display = 'block';
}
async function submitAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const pseudo = document.getElementById('authPseudo').value.trim();
  if(!email || !password){ showAuthError('Email et mot de passe requis.'); return; }
  if(authMode === 'signup' && !pseudo){ showAuthError('Choisissez un pseudo.'); return; }
  try {
    let res;
    if(authMode === 'signup'){
      res = await fetch(SUPABASE_URL + '/auth/v1/signup', {
        method: 'POST',
        headers: {'apikey': SUPABASE_KEY, 'Content-Type': 'application/json'},
        body: JSON.stringify({email, password, data: {pseudo}})
      });
    } else {
      res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: {'apikey': SUPABASE_KEY, 'Content-Type': 'application/json'},
        body: JSON.stringify({email, password})
      });
    }
    const data = await res.json();
    if(!res.ok){
      const msg = data.msg || data.error_description || data.error || 'Une erreur est survenue.';
      throw new Error(msg);
    }
    if(authMode === 'signup' && !data.access_token){
      showAuthError('Compte créé ! Vérifiez votre email pour confirmer, puis connectez-vous.', true);
      return;
    }
    saveSession(data);
    closeAll();
    render();
  } catch(e){
    showAuthError(e.message === 'Invalid login credentials' ? 'Email ou mot de passe incorrect.' : e.message);
  }
}
function saveSession(data){
  session = {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + (data.expires_in || 3600) * 1000,
    user: data.user
  };
  localStorage.setItem('eco_session', JSON.stringify(session));
  currentUser = (session.user.user_metadata && session.user.user_metadata.pseudo) || session.user.email;
  localStorage.setItem('eco_user', currentUser);
  updateNav();
  fetchMyAlerts().then(renderStories);
}
function logout(){
  session = null;
  currentUser = null;
  myAlerts = [];
  localStorage.removeItem('eco_session');
  localStorage.removeItem('eco_user');
  closeAll();
  updateNav();
  renderStories();
}
async function refreshSessionIfNeeded(){
  if(!session) return;
  if(Date.now() < session.expires_at - 60000) return;
  try {
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: {'apikey': SUPABASE_KEY, 'Content-Type': 'application/json'},
      body: JSON.stringify({refresh_token: session.refresh_token})
    });
    const data = await res.json();
    if(res.ok) saveSession(data); else logout();
  } catch(e){ /* réseau indispo : on retente au prochain appel */ }
}
function onAvatarClick(){
  if(session){
    document.getElementById('meNom').textContent = currentUser;
    document.getElementById('meProfilLink').href = 'profil.html?pseudo=' + encodeURIComponent(currentUser);
    document.getElementById('shMe').classList.add('open');
  } else {
    openAuth();
  }
}

// ── Couleurs & utils ──────────────────────────────────
const PALETTE=[['#F59E0B','#1A0A00'],['#22C55E','#fff'],['#3B82F6','#fff'],['#8B5CF6','#fff'],['#EC4899','#fff'],['#F97316','#fff'],['#14B8A6','#fff'],['#6366F1','#fff']];
function pc(name){return PALETTE[(name||'?').charCodeAt(0)%PALETTE.length];}
function ini(name){return (name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
const RANKS=[
  {min:0,l:'🌱 Débutant',c:'#6B7280',bg:'#F3F4F6'},
  {min:3,l:'🔍 Chasseur',c:'#3B82F6',bg:'#EFF6FF'},
  {min:8,l:'⚡ Expert',c:'#8B5CF6',bg:'#F5F3FF'},
  {min:15,l:'🔥 Maître',c:'#F97316',bg:'#FFF7ED'},
  {min:30,l:'👑 Légende',c:'#B45309',bg:'#FFFBEB'},
];
function rank(n){return RANKS.filter(r=>n>=r.min).pop();}

const CATS=[
  {e:'🌐',l:'Toutes'},{e:'📱',l:'Téléphonie'},{e:'🛒',l:'Courses'},
  {e:'⚡',l:'Énergie'},{e:'🏦',l:'Banque'},{e:'🚗',l:'Transport'},
  {e:'✈️',l:'Voyage'},{e:'🏠',l:'Logement'},{e:'🎬',l:'Abos'},
  {e:'🛡️',l:'Assurances'},{e:'👕',l:'Mode'},{e:'🍽️',l:'Restos'},
  {e:'💊',l:'Santé'},{e:'📚',l:'Enfants'},{e:'🐾',l:'Animaux'},
  {e:'🎁',l:'Cadeaux'},{e:'💡',l:'Bricolage'},{e:'🖥️',l:'High-Tech'},
];
function slugify(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
CATS.forEach(c=>c.slug=slugify(c.l));

let posts = [], sortMode = 'top', filterCat = null;
let myAlerts = [];
let lastSeen = JSON.parse(localStorage.getItem('eco_lastseen')||'{}');
let voted = JSON.parse(localStorage.getItem('eco_voted')||'[]');
let tested = JSON.parse(localStorage.getItem('eco_tested')||'[]');
let reported = JSON.parse(localStorage.getItem('eco_reported')||'[]');
let currentUser = localStorage.getItem('eco_user')||null;
let session = JSON.parse(localStorage.getItem('eco_session')||'null');
if(session && session.user){
  currentUser = session.user.user_metadata && session.user.user_metadata.pseudo || currentUser;
}

function rel(p){
  const pos=p.votes+p.tested*2;
  const neg=p.reports*3;
  if(pos===0)return 100;
  return Math.max(0,Math.min(100,Math.round((pos-neg)/pos*100)));
}

function timeAgo(ts){
  const d=Date.now()-new Date(ts).getTime();
  if(d<3600000)return Math.floor(d/60000)+'min';
  if(d<86400000)return Math.floor(d/3600000)+'h';
  return Math.floor(d/86400000)+'j';
}

function getSorted(){
  let list=filterCat?posts.filter(p=>p.categorie.startsWith(filterCat.slice(0,2))):[...posts];
  if(sortMode==='top')list.sort((a,b)=>b.votes-a.votes);
  else if(sortMode==='new')list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  else if(sortMode==='eco')list.sort((a,b)=>b.economie-a.economie);
  else if(sortMode==='rel')list.sort((a,b)=>rel(b)-rel(a));
  return list;
}

// ── Load depuis Supabase ──────────────────────────────
async function loadPosts() {
  try {
    posts = await sbFetch('astuces?order=votes.desc&limit=100');
    render();
  } catch(e) {
    document.getElementById('feed').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><h3>Erreur de chargement</h3><p>'+e.message+'</p></div>';
  }
}

// ── Render ─────────────────────────────────────────────
function render(){
  renderStories();
  renderFeed();
  updateNav();
}

function catHasNew(c){
  if(!myAlerts.includes(c.slug)) return false;
  const seen = lastSeen[c.slug] || 0;
  return posts.some(p=>p.categorie.startsWith(c.e.slice(0,2)) && new Date(p.created_at).getTime() > seen);
}
function renderStories(){
  const st=document.getElementById('stories');
  st.innerHTML=CATS.map((c,i)=>{
    const active=i===0&&!filterCat||(filterCat&&filterCat.startsWith(c.e));
    const href = i===0 ? '/forum-astuces.html' : ('/astuces/'+c.slug);
    const subscribed = myAlerts.includes(c.slug);
    const bell = i!==0 ? `<button class="story-bell ${subscribed?'on':''}" title="${subscribed?'Alertes activées':'Recevoir une alerte'}" onclick="event.preventDefault();event.stopPropagation();toggleAlert('${c.slug}')">${subscribed?'🔔':'🔕'}</button>` : '';
    const dot = i!==0 && catHasNew(c) ? '<span class="story-dot"></span>' : '';
    return `<a class="story ${active?'sel':''}" href="${href}" onclick="event.preventDefault();setCat(${i===0?'null':"'"+c.e+"'"})">
      <div class="story-ring ${active?'active':'inactive'}"><div class="story-inner">${c.e}</div>${dot}${bell}</div>
      <div class="story-label">${c.l}</div>
    </a>`;
  }).join('');
}

function renderFeed(){
  const list=getSorted();
  const feed=document.getElementById('feed');
  if(!list.length){
    feed.innerHTML=`<div class="empty"><div class="empty-icon">💡</div><h3>Soyez le premier !</h3><p>Partagez votre première astuce économies.</p></div>`;
    return;
  }
  feed.innerHTML=list.map(p=>{
    const hv=voted.includes(p.id);
    const ht=tested.includes(p.id);
    const hr=reported.includes(p.id);
    const r=rel(p);
    const rc=r>=80?'#22C55E':r>=60?'#F97316':'#EF4444';
    const [bg,fg]=pc(p.auteur||'A');
    const userPosts=posts.filter(x=>x.auteur===p.auteur).length;
    const rk=rank(userPosts);
    return `<div class="post">
      <div class="post-header">
        <div class="post-avatar" style="background:${bg};color:${fg}">${ini(p.auteur)}</div>
        <div class="post-meta">
          <div class="post-name">
            ${p.auteur ? `<a href="/profil/${encodeURIComponent(p.auteur)}" style="cursor:pointer">${p.auteur}</a>` : `<span>Anonyme</span>`}
            <span class="post-rank" style="background:${rk.bg};color:${rk.c}">${rk.l}</span>
          </div>
          <div class="post-cat">${p.categorie} · il y a ${timeAgo(p.created_at)}</div>
        </div>
      </div>
      <div class="post-title">${p.titre}</div>
      <div class="post-body">${p.description}</div>
      ${p.economie>0?`<div class="saving-pill">💰 ${p.economie.toLocaleString('fr-FR')}€ économisés/an</div>`:''}
      <div class="reliability">
        <div class="rel-track"><div class="rel-fill" style="width:${r}%;background:${rc}"></div></div>
        <span class="rel-label" style="color:${rc}">${r}% fiable</span>
        ${r<50?'<span style="font-size:11px;font-weight:600;color:#EF4444">⚠️ À vérifier</span>':''}
      </div>
      <div class="post-actions">
        <button class="action ${hv?'liked':''}" onclick="doVote(${p.id})">
          <span class="action-icon">${hv?'❤️':'🤍'}</span> ${p.votes}
        </button>
        <button class="action ${ht?'tested-on':''}" onclick="doTest(${p.id})">
          <span class="action-icon">${ht?'✅':'☑️'}</span> ${p.tested} testés
        </button>
        <button class="action ${hr?'flagged':''}" onclick="doReport(${p.id})">
          <span class="action-icon">🚩</span>${p.reports>0?' '+p.reports:''}
        </button>
      </div>
    </div>`;
  }).join('');
}

function updateNav(){
  const el=document.getElementById('navAv');
  if(session && currentUser){
    const [bg,fg]=pc(currentUser);
    el.className='nav-avatar';
    el.style.background=bg;el.style.color=fg;el.style.border='2px solid var(--border)';
    el.textContent=ini(currentUser);
  } else {
    el.className='nav-login';
    el.removeAttribute('style');
    el.innerHTML='👤 Connexion';
  }
}

// ── Actions Supabase ──────────────────────────────────
async function doVote(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  const inc=voted.includes(id)?-1:1;
  try {
    await sbFetch(`astuces?id=eq.${id}`, {method:'PATCH', body:JSON.stringify({votes:p.votes+inc}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
    p.votes+=inc;
    if(inc>0)voted.push(id); else voted=voted.filter(x=>x!==id);
    localStorage.setItem('eco_voted',JSON.stringify(voted));
    renderFeed();
  } catch(e){console.error(e);}
}

async function doTest(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  const inc=tested.includes(id)?-1:1;
  try {
    await sbFetch(`astuces?id=eq.${id}`, {method:'PATCH', body:JSON.stringify({tested:p.tested+inc}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
    p.tested+=inc;
    if(inc>0)tested.push(id); else tested=tested.filter(x=>x!==id);
    localStorage.setItem('eco_tested',JSON.stringify(tested));
    renderFeed();
  } catch(e){console.error(e);}
}

async function doReport(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  if(reported.includes(id))return;
  if(!confirm('Signaler cette astuce ?'))return;
  try {
    await sbFetch(`astuces?id=eq.${id}`, {method:'PATCH', body:JSON.stringify({reports:p.reports+1}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
    p.reports+=1;reported.push(id);
    localStorage.setItem('eco_reported',JSON.stringify(reported));
    renderFeed();
  } catch(e){console.error(e);}
}

// ── Alertes par catégorie ───────────────────────────────
async function fetchMyAlerts(){
  if(!session){myAlerts=[];return;}
  try {
    const rows = await sbFetch('alerts?select=categorie');
    myAlerts = rows.map(r=>r.categorie);
  } catch(e){console.error(e);myAlerts=[];}
}
async function toggleAlert(slug){
  if(!session){openAuth();return;}
  try {
    if(myAlerts.includes(slug)){
      await sbFetch(`alerts?user_id=eq.${session.user.id}&categorie=eq.${slug}`, {method:'DELETE', prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
      myAlerts = myAlerts.filter(s=>s!==slug);
    } else {
      await sbFetch('alerts', {method:'POST', body:JSON.stringify({user_id:session.user.id, categorie:slug}), prefer:'return=minimal', headers:{'Prefer':'return=minimal'}});
      myAlerts.push(slug);
    }
    renderStories();
  } catch(e){console.error(e);}
}

function setSort(s,btn){
  sortMode=s;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderFeed();
}
function setCat(c){
  filterCat=c;
  const cat = CATS.find(x=>x.e===c);
  if(cat){ lastSeen[cat.slug]=Date.now(); localStorage.setItem('eco_lastseen',JSON.stringify(lastSeen)); }
  renderStories();renderFeed();
  const url = cat && cat.slug!=='toutes' ? ('?cat='+cat.slug) : location.pathname;
  history.pushState({cat:c}, '', url);
  document.title = cat && cat.slug!=='toutes' ? (cat.l+' — Astuces Economya Community') : 'Astuces — Economya Community';
}
function initCatFromUrl(){
  const pathMatch = location.pathname.match(/\/astuces\/([^/]+)/);
  const slug = (pathMatch && pathMatch[1]) || new URLSearchParams(location.search).get('cat');
  if(!slug) return;
  const cat = CATS.find(x=>x.slug===slug);
  if(cat && cat.slug!=='toutes'){
    filterCat = cat.e;
    document.title = cat.l+' — Astuces Economya Community';
  }
}
window.addEventListener('popstate', (e)=>{
  filterCat = e.state && e.state.cat || null;
  renderStories();renderFeed();
});

// ── Post ──────────────────────────────────────────────
function openPost(){
  const fAuthor = document.getElementById('fAuthor');
  if(session){
    fAuthor.value = currentUser;
    fAuthor.readOnly = true;
    fAuthor.style.background = '#F3F4F6';
  } else {
    fAuthor.readOnly = false;
    fAuthor.style.background = '';
    if(currentUser) fAuthor.value = currentUser;
  }
  document.getElementById('shPost').classList.add('open');
}

function updateCount(){
  const len=document.getElementById('fBody').value.length;
  const el=document.getElementById('charCount');
  el.textContent=len+'/500';
  el.style.color=len>450?'#EF4444':len>400?'#F97316':'#737373';
}

async function submitPost(){
  const titre=document.getElementById('fTitle').value.trim();
  const description=document.getElementById('fBody').value.trim();
  if(!titre||!description){alert('Titre et description obligatoires !');return;}
  const auteur=(session ? currentUser : document.getElementById('fAuthor').value.trim())||'Anonyme';
  const economie=parseInt(document.getElementById('fSaving').value)||0;
  const categorie=document.getElementById('fCat').value;
  if(!session){currentUser=auteur;localStorage.setItem('eco_user',auteur);}
  try {
    const payload = {titre, description, categorie, economie, auteur, votes:1, tested:0, reports:0};
    if(session) payload.user_id = session.user.id;
    const newPost = await sbFetch('astuces', {
      method:'POST',
      body:JSON.stringify(payload)
    });
    posts.unshift(Array.isArray(newPost)?newPost[0]:newPost);
    voted.push(posts[0].id);
    localStorage.setItem('eco_voted',JSON.stringify(voted));
    closeAll();
    setSort('new',document.querySelectorAll('.tab')[1]);
    ['fTitle','fBody','fSaving'].forEach(id=>document.getElementById(id).value='');
    updateNav();
  } catch(e){alert('Erreur: '+e.message);}
}

function closeAll(){document.querySelectorAll('.modal-bg').forEach(m=>m.classList.remove('open'));}
document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeAll();}));

// ── Init ──────────────────────────────────────────────
initCatFromUrl();
refreshSessionIfNeeded().then(fetchMyAlerts).then(()=>{ if(posts.length) renderStories(); });
updateNav();
loadPosts();
</script>
