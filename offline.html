<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#085041">
<title>Hors connexion — Economya.fr</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#FAFAF8;color:#2C2C2A;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.box{max-width:360px}
.logo{font-family:Georgia,'Times New Roman',serif;font-weight:900;font-size:1.6rem;color:#085041;margin-bottom:18px}
.logo span{color:#EF9F27}
h1{font-size:1.15rem;margin-bottom:8px}
p{font-size:.92rem;line-height:1.6;color:#5F5E5A;margin-bottom:20px}
button{background:#085041;color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:.95rem;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Econom<span>ya</span>.fr</div>
  <h1>Vous êtes hors connexion</h1>
  <p>Economya a besoin d'internet pour afficher les astuces. Vérifiez votre connexion, puis réessayez.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</div>
</body>
</html>
